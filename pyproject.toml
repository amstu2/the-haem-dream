    "fastapi>=0.136.1",
    "google-cloud-storage>=3.10.1",
    "pandas>=2.3.3",
    "ray[data,serve,train]>=2.55.1",
    "streamlit>=1.57.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "uvicorn>=0.46.0",
]
